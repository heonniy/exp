[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "h100-kv-expert-residency"
version = "0.1.0"
description = "Reproducible H100 KV-cache versus MoE expert-residency experiments"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.0,<2",
  "duckdb>=1.5,<2",
  "matplotlib>=3.10,<4",
  "numpy>=2.0,<3",
  "psutil>=7,<8",
  "pyyaml>=6,<7",
  "safetensors>=0.5,<1",
  "torch==2.7.1",
  "transformers>=4.51,<6",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["experiments*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
